<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Notepad</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #59636e;
      --accent: #2f6feb;
      --border: #e1e4e8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --card: #161b22;
        --text: #e6edf3;
        --muted: #9198a1;
        --accent: #4493f8;
        --border: #30363d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px 32px;
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0 0 32px;
      text-align: left;
    }
    li {
      padding: 10px 0;
      border-top: 1px solid var(--border);
    }
    li:last-child { border-bottom: 1px solid var(--border); }
    .button {
      display: inline-block;
      padding: 10px 24px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    .button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Welcome to Notepad</h1>
    <p>A simple place to write down your notes, ideas and to-dos.</p>
    <ul>
      <li>Write quick notes without distractions</li>
      <li>Keep ideas and to-do lists in one place</li>
      <li>Come back anytime to pick up where you left off</li>
    </ul>
    <a class="button" href="https://github.com/VikramTKV/notepad">View on GitHub</a>
  </main>
</body>
</html>
